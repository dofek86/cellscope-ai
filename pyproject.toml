[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellscope-ai"
version = "0.3.0"
description = "Explainable quality control for organ-on-a-chip bright-field microscopy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pillow>=11.0",
]

[project.optional-dependencies]
app = ["gradio>=5.0"]
train = ["opencv-python-headless>=4.10", "scikit-learn>=1.6", "tifffile>=2025.10", "torch>=2.6", "torchvision>=0.21"]
morphem = ["transformers>=4.57,<5", "timm>=1.0"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
